site_name: TW GPSS (Unofficial) MCP Tools Documentation
site_author: Hsiang-Jen Li
theme:
  name: readthedocs
plugins:
  - search
  - neoteroi.mkdocsoad
  - mkdocstrings:
        handlers:
          python:
            options:
              docstring_style: google
              members: true
              members_order: source
              filters: ["!^_"]               
              show_submodules: false   
              separate_signature: true 
              show_attribute_values: true
nav:
  - Home: index.md
  - API Reference:
    - Swagger: reference/endpoints_swagger.md
    - Enum: reference/enum.md